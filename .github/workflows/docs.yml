name: Documentation contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: documentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install -r documentation/tools/requirements.txt
      - name: Check links and examples
        run: python -B documentation/tools/check_docs.py
      - name: Check documentation contracts and schemas
        run: python -B documentation/tools/check_contract.py
      - name: Check patch whitespace
        working-directory: documentation
        run: git diff --check

  implementation:
    name: Optional private implementation comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMPLEMENTATION_TOKEN: ${{ secrets.DOCS_IMPLEMENTATION_TOKEN }}
    steps:
      - name: Report comparison availability
        run: |
          if [ -z "$IMPLEMENTATION_TOKEN" ]; then
            echo "::notice::Private implementation comparison NOT RUN: DOCS_IMPLEMENTATION_TOKEN is not configured or unavailable to this event."
            echo "### Private implementation comparison: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "The documentation checks ran separately. This result does not prove source/response alignment. Run the offline comparison locally, or configure a read-only token scoped to bsk-qqbot." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: env.IMPLEMENTATION_TOKEN != ''
        with:
          path: documentation
      - uses: actions/checkout@v4
        if: env.IMPLEMENTATION_TOKEN != ''
        with:
          repository: bedkillerspacex-boop/bsk-qqbot
          ref: 75ec6037a5cd6f6e59bfde10bf8fb03a74c4d7a9
          path: implementation
          token: ${{ env.IMPLEMENTATION_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.IMPLEMENTATION_TOKEN != ''
        with:
          python-version: '3.13'
      - name: Install schema validator
        if: env.IMPLEMENTATION_TOKEN != ''
        run: python -m pip install -r documentation/tools/requirements.txt
      - name: Compare implemented contracts offline
        if: env.IMPLEMENTATION_TOKEN != ''
        run: |
          python -B documentation/tools/check_contract.py --implementation implementation
          echo "### Private implementation comparison: PASSED" >> "$GITHUB_STEP_SUMMARY"
