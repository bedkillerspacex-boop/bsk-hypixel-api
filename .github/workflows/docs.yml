name: Documentation contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: documentation
      - uses: actions/checkout@v4
        with:
          repository: bedkillerspacex-boop/bsk-qqbot
          ref: 75ec6037a5cd6f6e59bfde10bf8fb03a74c4d7a9
          path: implementation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install -r documentation/tools/requirements.txt
      - name: Check links and examples
        run: python -B documentation/tools/check_docs.py
      - name: Compare implemented contracts offline
        run: python -B documentation/tools/check_contract.py --implementation implementation
      - name: Check patch whitespace
        working-directory: documentation
        run: git diff --check
